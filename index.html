<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="熠序交幹典禮相框製作工具，上傳照片後套用活動相框、自動調色並分享。"
    />
    <title>熠序交幹典禮相框製作</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" data-step="1">
      <header class="app-topbar">
        <button id="backButton" class="back-button" type="button" aria-label="返回上一頁">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>

      <section class="app-screen intro-screen is-active" data-step-panel="1" aria-labelledby="introTitle">
        <div class="intro-hero">
          <img class="event-logo" src="assets/logos/yixu-wordmark.png" alt="熠序" />
          <div class="intro-copy">
            <p class="intro-kicker">9th iOS Club 交幹典禮</p>
            <h1 id="introTitle" class="visually-hidden">熠序交幹典禮相框製作</h1>
            <p class="intro-title">把這一任的光，交給下一段序章。</p>
            <p class="intro-text">用熠序限定相框留下合照、個人照或典禮瞬間，完成後直接分享給朋友。</p>
          </div>
        </div>

        <button id="startButton" class="primary-action wide-action bottom-action" type="button">
          開始製作
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
        </button>
      </section>

      <section class="app-screen photo-screen" data-step-panel="2" aria-labelledby="photoStepTitle">
        <div class="screen-copy">
          <h2 id="photoStepTitle">選擇照片</h2>
          <p>先選一張 HEIC、PNG 或 JPG 照片，上傳後再開啟預覽、調色與縮放。</p>
        </div>

        <input
          id="photoInput"
          type="file"
          accept="image/heic,image/heif,image/jpeg,image/jpg,image/png,.heic,.heif,.jpg,.jpeg,.png"
        />

        <div class="photo-empty-card">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 17.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5" />
              <path d="M12 3v12" />
              <path d="m7 8 5-5 5 5" />
            </svg>
          </div>
          <p class="empty-title">先放進一張想留下的照片</p>
          <p class="empty-text">支援 HEIC、PNG、JPG；下一步才會出現調整工具。</p>
          <label class="upload-button" for="photoInput">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 17.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5" />
              <path d="M12 3v12" />
              <path d="m7 8 5-5 5 5" />
            </svg>
            選擇照片
          </label>
        </div>

        <div class="preview-card photo-workspace">
          <canvas id="previewCanvas" width="2400" height="1800" aria-label="照片預覽"></canvas>
        </div>
        <p id="statusMessage" class="status-message" role="status">上傳照片開始製作。</p>

        <div class="tool-stack photo-tools">
          <button id="replacePhotoButton" class="upload-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 17.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5" />
              <path d="M12 3v12" />
              <path d="m7 8 5-5 5 5" />
            </svg>
            重新選照片
          </button>
          <p id="fileName" class="file-name">尚未選擇照片</p>

          <label class="switch-row">
            <span>
              <strong>自動調色</strong>
              <small>亮度、對比與色彩會在輸出時一起套用</small>
            </span>
            <input id="autoToneToggle" type="checkbox" checked />
          </label>

          <label class="range-row" for="zoomRange">
            <span>照片縮放</span>
            <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1" disabled />
          </label>

          <button id="resetButton" class="ghost-action" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
            重設位置
          </button>
        </div>

        <button id="toFrameButton" class="primary-action wide-action bottom-action photo-next-action" type="button" disabled>
          下一步：選相框
        </button>
      </section>

      <section class="app-screen frame-screen" data-step-panel="3" aria-labelledby="frameStepTitle">
        <div class="screen-copy">
          <h2 id="frameStepTitle">選擇相框</h2>
          <p>直接看套用後的預覽圖，點選喜歡的版型。</p>
        </div>

        <div id="frameList" class="frame-list" role="listbox" aria-label="可用相框"></div>
      </section>

      <section class="app-screen finish-screen" data-step-panel="4" aria-labelledby="finishStepTitle">
        <div class="screen-copy">
          <h2 id="finishStepTitle">完成</h2>
          <p>確認照片後，直接分享給朋友。</p>
        </div>

        <div class="preview-card final-preview">
          <img class="rendered-preview" alt="完成的相框照片" />
        </div>

        <div class="action-stack bottom-action" aria-label="輸出動作">
          <button id="shareButton" class="primary-action wide-action" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3v12" />
              <path d="m7 8 5-5 5 5" />
              <path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
            </svg>
            一鍵分享
          </button>
          <button id="makeAnotherButton" class="secondary-action wide-action" type="button">
            再做一張
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
